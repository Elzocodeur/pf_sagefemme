services:
  postgres:
    image: postgres:16-alpine
    container_name: pf_sagefemme_db
    environment:
      POSTGRES_DB: pf_sagefemme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pf_sagefemme_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pf_sagefemme"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pf_sagefemme_app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pf_sagefemme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pf_sagefemme_data: