spring.application.name=PF-sageFemme

# Profil par defaut : "local" => charge application-local.properties (gitignore).
# En prod, surcharger avec SPRING_PROFILES_ACTIVE=prod (ou autre).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Datasource - PostgreSQL (les credentials sont injectes par profil ou via variables d'environnement)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pf_sagefemme}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
# ddl-auto=none : c'est Flyway la source de verite du schema, Hibernate ne touche pas a la BDD.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway (la source de verite du schema c'est le SQL versionne)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

# Security / JWT
# Cle Base64 256 bits minimum. En prod, generer via : openssl rand -base64 64
app.security.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtdXNlLW9wZW5zc2wtcmFuZC1iYXNlNjQtNjQ=}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.jwt.issuer=${JWT_ISSUER:planifem}

# Bootstrap super admin (cree au demarrage si aucun n'existe)
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@planifem.local}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:ChangeMe!2026}
app.bootstrap.super-admin.nom=${BOOTSTRAP_SUPER_ADMIN_NOM:Admin}
app.bootstrap.super-admin.prenom=${BOOTSTRAP_SUPER_ADMIN_PRENOM:Super}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Jackson
# Note : Spring Boot 4 / Jackson 3 ecrit deja les dates en ISO 8601 par defaut,
# inutile de configurer WRITE_DATES_AS_TIMESTAMPS (qui n'existe plus dans l'enum).
spring.jackson.default-property-inclusion=non_null
